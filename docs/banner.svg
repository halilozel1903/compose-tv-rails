<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-tv-rails: media rows for Android TV with Compose for TV" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#1b1830"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3c72"/>
      <stop offset="0.6" stop-color="#6a3a8c"/>
      <stop offset="1" stop-color="#d76d77"/>
    </linearGradient>
    <linearGradient id="heroScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#134e5e"/><stop offset="1" stop-color="#71b280"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff512f"/><stop offset="1" stop-color="#dd2476"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4568dc"/><stop offset="1" stop-color="#b06ab3"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2027"/><stop offset="1" stop-color="#2c5364"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e2de2"/><stop offset="1" stop-color="#4a00e0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ffb86b" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="176" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-2">compose-tv-rails</text>
    <text x="82" y="230" fill="#ffd9ad" font-size="26" font-weight="500">Media rows for Android TV with Compose for TV:</text>
    <text x="82" y="266" fill="#ffd9ad" font-size="26" font-weight="500">hero carousel, focusable rails, D-pad navigation</text>
    <text x="82" y="326" fill="#ffb86b" font-size="19" font-family="'JetBrains Mono', Menlo, monospace">TvRails(rails, header = { HeroCarousel(featured) })</text>
    <g font-size="17" font-weight="600" fill="#ffe9d1">
      <rect x="82" y="360" width="84" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="124" y="384" text-anchor="middle">Hero</text>
      <rect x="176" y="360" width="84" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="218" y="384" text-anchor="middle">Rails</text>
      <rect x="270" y="360" width="94" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="317" y="384" text-anchor="middle">D-pad</text>
      <rect x="374" y="360" width="124" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="436" y="384" text-anchor="middle">Focus glow</text>
      <rect x="82" y="406" width="168" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="166" y="430" text-anchor="middle">Continue watching</text>
      <rect x="260" y="406" width="124" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="322" y="430" text-anchor="middle">Immersive</text>
    </g>
    <g transform="translate(640 70)" filter="url(#shadow)">
      <rect width="580" height="360" rx="18" fill="#0b0e14" stroke="#2a3040" stroke-width="6"/>
      <rect x="20" y="20" width="540" height="150" rx="12" fill="url(#hero)"/>
      <circle cx="450" cy="80" r="34" fill="#ffc371" fill-opacity="0.9"/>
      <path d="M20 150 C 140 110, 260 160, 380 130 S 520 120, 560 128 L560 158 Q560 170 548 170 L32 170 Q20 170 20 158 Z" fill="#000" fill-opacity="0.35"/>
      <rect x="20" y="20" width="540" height="150" rx="12" fill="url(#heroScrim)"/>
      <rect x="40" y="46" width="34" height="14" rx="4" fill="#ffb86b"/>
      <text x="40" y="92" fill="#fff" font-size="22" font-weight="800">The Quiet Orbit</text>
      <text x="40" y="114" fill="#fff" fill-opacity="0.8" font-size="12">2026 · Science fiction · 2h 8m</text>
      <rect x="40" y="128" width="62" height="22" rx="11" fill="#fff"/>
      <path d="M50 134 L58 139 L50 144 Z" fill="#000"/>
      <text x="64" y="143" fill="#000" font-size="11" font-weight="700">Play</text>
      <rect x="490" y="152" width="22" height="6" rx="3" fill="#fff"/>
      <circle cx="521" cy="155" r="3" fill="#fff" fill-opacity="0.45"/>
      <circle cx="532" cy="155" r="3" fill="#fff" fill-opacity="0.45"/>
      <circle cx="543" cy="155" r="3" fill="#fff" fill-opacity="0.45"/>
      <text x="20" y="200" fill="#f1f3f8" font-size="13" font-weight="700">Continue watching</text>
      <rect x="20" y="212" width="116" height="65" rx="8" fill="url(#c1)"/>
      <rect x="28" y="266" width="100" height="4" rx="2" fill="#fff" fill-opacity="0.3"/>
      <rect x="28" y="266" width="66" height="4" rx="2" fill="#ffb86b"/>
      <g filter="url(#glow)">
        <rect x="146" y="205" width="130" height="79" rx="9" fill="url(#c2)" stroke="#ffffff" stroke-width="3"/>
      </g>
      <rect x="156" y="272" width="110" height="4" rx="2" fill="#fff" fill-opacity="0.3"/>
      <rect x="156" y="272" width="40" height="4" rx="2" fill="#ffb86b"/>
      <text x="146" y="302" fill="#fff" font-size="11" font-weight="700">Copper Valley</text>
      <text x="146" y="316" fill="#a7b0c0" font-size="10">Western · 1h 12m left</text>
      <rect x="286" y="212" width="116" height="65" rx="8" fill="url(#c3)"/>
      <rect x="294" y="266" width="100" height="4" rx="2" fill="#fff" fill-opacity="0.3"/>
      <rect x="294" y="266" width="18" height="4" rx="2" fill="#ffb86b"/>
      <rect x="412" y="212" width="116" height="65" rx="8" fill="url(#c4)"/>
      <rect x="538" y="212" width="22" height="65" rx="8" fill="url(#c5)"/>
      <text x="20" y="342" fill="#f1f3f8" font-size="13" font-weight="700">Trending now</text>
    </g>
    <g transform="translate(700 470)" fill="#a7b0c0" font-size="15" font-weight="600">
      <rect x="0" y="0" width="34" height="34" rx="17" fill="none" stroke="#a7b0c0" stroke-width="2"/>
      <path d="M17 7 L23 13 L11 13 Z M17 27 L23 21 L11 21 Z M7 17 L13 11 L13 23 Z M27 17 L21 11 L21 23 Z" fill="#a7b0c0"/>
      <text x="46" y="22">Left, right, up, down: each rail remembers its card</text>
    </g>
  </g>
</svg>
